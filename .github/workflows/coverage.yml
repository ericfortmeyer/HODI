name: Generate and Upload Test Coverage Results
on: ["push", "pull_request"]
    # branches:
    #   - main
    # paths:
    #   - '**.fs'
    #   - '.github/workflows/coverage.yml'
env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  test-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          cache: true
          cache-dependency-path: src/HODI/packages.lock.json
          dotnet-version: 10.0.*
      - run: dotnet restore --locked-mode
      - name: Test
        run: |
          dotnet test --verbosity normal --results-directory coverage --collect:"XPlat Code Coverage" --settings coverlet.runsettings
      - name: Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          debug: true
